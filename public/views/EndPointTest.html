<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Webhook テストツール</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 8px; max-width: 500px; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
        pre { background: #f4f4f4; padding: 15px; border-radius: 4px; border: 1px solid #ddd; }
    </style>
</head>
<body>

    <h2>Render Webhook テスト送信</h2>

    <div class="form-group">
        <label for="url">RenderのエンドポイントURL:</label>
        <input type="text" id="url" value="https://my-node-server-yetm.onrender.com/">
<!--
/pic-webhook            PIC完了Webhook
/pic-webhook-dev        PIC完了Webhook(dev)
/kintone-webhook        Zapier NewData Webhook
/kintone-webhook-dev    Zapier NewData Webhook(dev)
-->

    </div>

    <div class="form-group">
        <label for="apiKey">apiKey (SHOWCASE_KEYの値):</label>
        <input type="text" id="apiKey" value="YOUR_SHOWCASE_KEY_VALUE">
    </div>

    <button id="sendBtn">テスト送信を実行</button>

    <h3>実行結果:</h3>
    <pre id="result">ボタンを押すとここに結果が表示されます</pre>

    <script>
        document.getElementById('sendBtn').addEventListener('click', async () => {
            const url = document.getElementById('url').value;
            const apiKey = document.getElementById('apiKey').value;
            const resultEl = document.getElementById('result');

            resultEl.textContent = '送信中...';

//            const testData = {
//                apiKey: apiKey
//            };
            const testData = {
                apiKey: 'YOUR_SHOWCASE_KEY_VALUE',
                bindKeys: [
                    "高砂義昭19590310xxxxxxx",      // 更新キー
                    "登録",                         //申告種別
                    "高砂",                         //姓
                    "義昭",                         //名
                    "y-takasago_00@go-parner.jp",   //メアド
                    "result",                       //redsult
                    "operation",                    //operation
                    "authType"                      //authType
                ]
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(testData)
                });

                const resultText = await response.text();
                
                resultEl.textContent = `ステータスコード: ${response.status}\n` +
                                     `レスポンス内容: ${resultText}\n\n` +
                                     `※ Render側のログ（Logs）も合わせて確認してください。`;
            } catch (error) {
                resultEl.textContent = `通信エラーが発生しました:\n${error.message}\n\n` +
                                     `【可能性のある原因】\n` +
                                     `・URLが間違っている\n` +
                                     `・Renderのサーバーが起動していない（Freeプランのスリープなど）\n` +
                                     `・CORSエラーが発生している`;
            }
        });
    </script>
</body>
</html>
