<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Render エンドポイント テストツール</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="email"] { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-size: 16px; }
        button:hover { background: #0056b3; }
        #result { margin-top: 20px; padding: 15px; border-radius: 4px; display: none; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <h2>Render Webhook テストツール</h2>
    <p>ボタンを押すと、指定したRenderのエンドポイントにテストデータをPOST送信します。</p>

    <div class="form-group">
        <label for="email">送信先（テスト用メールアドレス）:</label>
        <input type="email" id="email" value="your-test-email@example.com">
    </div>

    <div class="form-group">
        <label for="recordNum">レコード番号（テスト用）:</label>
        <input type="text" id="recordNum" value="999">
    </div>

    <button id="sendBtn">Webhookを送信</button>

    <div id="result"></div>

    <script>
        document.getElementById('sendBtn').addEventListener('click', async () => {
            const url = 'https://my-node-server-yetm.onrender.com/kintone-webhook';
            const resultDiv = document.getElementById('result');
            
            // 画面表示のリセット
            resultDiv.style.display = 'none';
            resultDiv.className = '';
            resultDiv.innerText = '送信中...';
            resultDiv.style.display = 'block';

            // Renderのコード（webhookData.メールアドレス、webhookData.レコード番号）に合わせる
            const payload = {
                "メールアドレス": document.getElementById('email').value,
                "レコード番号": document.getElementById('recordNum').value
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const responseText = await response.text();

                if (response.ok) {
                    resultDiv.className = 'success';
                    resultDiv.innerHTML = `<strong>通信成功 (ステータス: ${response.status})</strong><br>サーバーからの応答: ${responseText}`;
                } else {
                    resultDiv.className = 'error';
                    resultDiv.innerHTML = `<strong>サーバーエラー (ステータス: ${response.status})</strong><br>応答内容: ${responseText}`;
                }
            } catch (error) {
                // CORSエラーやネットワーク不通の場合はここに入る
                resultDiv.className = 'error';
                resultDiv.innerHTML = `<strong>通信失敗 (ネットワークエラー)</strong><br>ブラウザのデベロッパーツール（コンソール）を確認してください。<br>エラー内容: ${error.message}`;
                console.error('Fetch Error:', error);
            }
        });
    </script>
</body>
</html>
